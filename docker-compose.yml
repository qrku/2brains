services:
  app:
    # `image` names the published tag; `build` is only consulted when you explicitly
    # ask for it (`docker compose build` / `up --build`) — so local dev builds from
    # source, while the server's plain `docker compose pull` fetches this tag from
    # ghcr.io without ever building anything.
    image: ghcr.io/qrku/2brain:latest
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      # DATABASE_URL: postgres://prep:prep@db:5432/prep_tracker
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
