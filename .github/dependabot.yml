version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One PR per ecosystem group instead of one per package — the review cost of a
    # dependency bump is mostly fixed, so batching it is what keeps them getting merged.
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      next:
        patterns: ['next', 'eslint-config-next']
      testing:
        patterns: ['jest*', '@types/jest', '@testing-library/*', '@playwright/test']
      linting:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*', 'lint-staged', 'husky']
      types:
        patterns: ['@types/*']
    labels: ['dependencies']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    labels: ['dependencies', 'ci']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ['dependencies', 'docker']
